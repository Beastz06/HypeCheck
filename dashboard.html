<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hype vs. Wallet: ONON vs. NKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF7;
    --band: #EFECE2;
    --ink: #161616;
    --ink2: #4A4A45;
    --hair: #CBC8BD;
    --accent: #7A1F2B;   /* oxblood: used for the rating only */
    --on: #1F4E79;       /* blue */
    --nike: #8A6410;     /* dark gold */
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(18px, 0.9vw + 3px, 22px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 1rem; line-height: 1.5;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; line-height: 1.2; margin: 0; letter-spacing: -.005em; }
  .tk { font-family: var(--mono); font-weight: 500; letter-spacing: 0; }

  /* coverage header */
  .cover { border-bottom: 1px solid var(--ink); padding: 1rem 0 .8rem; font-size: 1rem; color: var(--ink2); }
  .cover .tk { color: var(--ink); }
  .cover .title { font-family: var(--serif); font-weight: 600; color: var(--ink); font-size: 1.15rem; }

  /* rating block */
  .rating { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 3.5rem; align-items: center;
            padding: 2.2rem 0 2.4rem; border-bottom: 1px solid var(--ink); }
  .rating .kicker { color: var(--ink2); font-size: 1.05rem; }
  .rating .word { font-family: var(--serif); font-weight: 600; color: var(--accent); line-height: 1;
                  font-size: clamp(3.6rem, 7vw, 6.2rem); margin: .7rem 0 .8rem; letter-spacing: -.01em; }
  .rating .word.long { font-size: clamp(2.6rem, 4.6vw, 4.2rem); }
  .rating .pts { font-size: 1.35rem; font-weight: 500; }
  .rating .detail { margin-top: .6rem; color: var(--ink2); }

  .gauge { position: relative; padding-top: 1.6rem; }
  .g-marker { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .g-val { font-weight: 600; font-size: 1.3rem; line-height: 1.4rem; color: var(--accent); }
  .g-marker i { display: block; width: 3px; height: 2.9rem; background: var(--accent); }
  .g-track { display: flex; height: 1.1rem; border: 1px solid var(--ink); }
  .g-track span { display: block; height: 100%; }
  .g-track .under { width: 25%; background: repeating-linear-gradient(135deg, #8d8a80 0 1px, transparent 1px 6px); }
  .g-track .inline { width: 50%; background: #E6E3D8; border-left: 1px solid var(--ink); border-right: 1px solid var(--ink); }
  .g-track .over { width: 25%; background: repeating-linear-gradient(45deg, #8d8a80 0 1px, transparent 1px 6px); }
  .g-ticks { position: relative; height: 1.5rem; margin-top: .25rem; font-size: .95rem; color: var(--ink2); }
  .g-ticks span { position: absolute; transform: translateX(-50%); }
  .g-names { position: relative; height: 1.6rem; font-size: 1rem; font-weight: 500; margin-top: .1rem; white-space: nowrap; }
  .g-names span { position: absolute; top: 0; }
  .g-names span:nth-child(1) { left: 0; }
  .g-names span:nth-child(2) { left: 50%; transform: translateX(-50%); }
  .g-names span:nth-child(3) { right: 0; }

  /* scorecard */
  .score { padding: 2rem 0 2.2rem; }
  .score h2 { margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 1.05rem 1.2rem 1.15rem 0; }
  th:nth-child(n+2), td:nth-child(n+2) { padding-left: 1.6rem; }
  th:nth-child(n+3), td:nth-child(n+3) { border-left: 1px solid var(--hair); }
  thead th { border-bottom: 1px solid var(--ink); padding-bottom: .8rem; font-weight: 400; }
  thead th.col { border-top: 4px solid var(--c); }
  thead th.on { --c: var(--on); } thead th.nike { --c: var(--nike); }
  tbody tr { border-bottom: 1px solid var(--hair); }
  tbody tr.has-note { border-bottom: none; }
  tbody tr.note td { padding: 0 0 1rem 1.6rem; border-bottom: 1px solid var(--hair); border-left: none; font-family: var(--serif);
                     font-style: italic; color: var(--ink2); font-size: 1.1rem; }
  tbody tr:last-child { border-bottom: 1px solid var(--ink); }
  col.c-label { width: 15%; }
  .ch { display: flex; align-items: center; gap: .9rem; }
  .lgbox { width: 3.2rem; height: 2.4rem; display: flex; align-items: center; justify-content: center; flex: none; }
  .lgbox img { max-width: 100%; max-height: 100%; display: block; }
  .cname { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; line-height: 1.1; color: var(--c); }
  .sw { display: inline-block; width: .7rem; height: .7rem; margin-right: .5rem; background: var(--c); vertical-align: .1em; }
  th.nike .sw { transform: rotate(45deg); }
  .cmeta { color: var(--ink2); font-size: 1rem; margin-top: .2rem; }
  .cmeta .tk { color: var(--ink); }
  tbody th { font-weight: 600; font-size: 1.15rem; }
  tbody th small { display: block; font-weight: 400; color: var(--ink2); font-size: 1rem; }
  .numrow { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .num { font-size: 3.5rem; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
  .of { color: var(--ink2); font-size: 1.1rem; }
  .side { margin-left: .6rem; font-size: 1.05rem; line-height: 1.35; }
  .side b { font-weight: 600; }
  .det { margin-top: .55rem; color: var(--ink2); font-size: 1.05rem; line-height: 1.45; }
  .det b { color: var(--ink); font-weight: 600; }

  /* backtest strip */
  .strip { background: var(--band); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 2rem 0 2.2rem; }
  .strip-head { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
  .strip-head .lgbox { width: 7rem; height: 1.8rem; }
  .strip .lede { margin: .5rem 0 1.4rem; color: var(--ink2); }
  .figs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }
  .fig { padding: 1rem 1.2rem 0 1.2rem; border-left: 1px solid var(--hair); }
  .fig:first-child { border-left: none; padding-left: 0; }
  .fig .big { font-size: 3.5rem; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
  .fig .cap { margin-top: .5rem; font-weight: 500; }
  .fig .sub { color: var(--ink2); font-size: 1rem; }
  .strip .reading { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--hair); font-size: 1.05rem; line-height: 1.55; }
  .strip .reading p { margin: 0 0 .5rem; }
  .strip .reading strong { font-weight: 600; }

  .foot { padding: 1.3rem 0 2.5rem; font-size: .9rem; color: var(--ink2); line-height: 1.5; }
  .foot p { margin: 0; }

  @media (max-width: 960px) {
    .wrap { padding: 0 1.2rem; }
    .rating { grid-template-columns: 1fr; gap: 1.8rem; }
    .figs { grid-template-columns: 1fr 1fr; }
    .fig:nth-child(3) { border-left: none; padding-left: 0; }
    .fig:nth-child(n+3) { margin-top: 1.2rem; }
    .num, .fig .big { font-size: 2.8rem; }
    th, td { padding-right: .7rem; }
    th:nth-child(n+2), td:nth-child(n+2) { padding-left: .9rem; }
  }
</style>
</head>

<script>
const MINUS = "−";
function sgn(n, dec) { const s = Math.abs(n).toFixed(dec); return (n < 0 ? MINUS : n > 0 ? "+" : "") + s; }
function ratioText(r) { return r.toFixed(2) + "×"; }

function render(d) {
  const v = d.verdict, on = d.products.On, nk = d.products.Nike;
  const cfg = {
    "OVERHYPED":       { text: "OVERHYPED relative to " + v.control },
    "UNDER-THE-RADAR": { text: "UNDER-THE-RADAR relative to " + v.control },
    "IN LINE":         { text: "IN LINE with " + v.control }
  }[v.verdict];

  // coverage header
  document.getElementById("cover").innerHTML =
    `<span class="tk">${on.ticker}</span> vs. <span class="tk">${nk.ticker}</span> &middot; <span class="title">Hype vs. Wallet</span>` +
    ` &middot; Data as of ${d.generated} &middot; n = ${d.sample_size}`;

  // rating block
  const pos = Math.max(0, Math.min(100, (v.difference + 30) / 60 * 100));
  const band = { "OVERHYPED": "above +15", "UNDER-THE-RADAR": "below " + MINUS + "15", "IN LINE": "between " + MINUS + "15 and +15" }[v.verdict];
  const ticks = [[0, MINUS + "30"], [25, MINUS + "15"], [50, "0"], [75, "+15"], [100, "+30"]]
    .map(t => `<span style="left:${t[0]}%">${t[1]}</span>`).join("");
  document.getElementById("rating").innerHTML =
    `<div>
       <div class="kicker">Rating: ${v.product} vs. ${v.control}</div>
       <div class="word${v.verdict.length > 9 ? " long" : ""}">${v.verdict}</div>
       <div class="pts">${sgn(v.difference, 0)} pts vs. ${v.control} &middot; threshold ±15</div>
       <div class="detail">${v.product} is ${cfg.text}. Hype minus Wallet gap: ${v.product} ${sgn(v.product_gap, 0)}, ${v.control} ${sgn(v.control_gap, 0)}.</div>
     </div>
     <div class="gauge" role="img" aria-label="Gauge from ${MINUS}30 to +30 points. Marker at ${sgn(v.difference, 0)}, ${band}, rated ${v.verdict}.">
       <div class="g-marker" style="left:${pos}%"><span class="g-val">${sgn(v.difference, 0)}</span><i></i></div>
       <div class="g-track"><span class="under"></span><span class="inline"></span><span class="over"></span></div>
       <div class="g-ticks">${ticks}</div>
       <div class="g-names"><span>UNDER-THE-RADAR</span><span>IN LINE</span><span>OVERHYPED</span></div>
     </div>`;

  // scorecard table
  const logo = (key, alt) => `<span class="lgbox"><img src="${LOGOS[key]}" alt="${alt} logo"></span>`;
  const head = (cls, name, p) =>
    `<th class="col ${cls}" scope="col"><div class="ch">${logo(cls, name)}<div>` +
    `<div class="cname"><span class="sw"></span>${name}</div>` +
    `<div class="cmeta"><span class="tk">${p.ticker}</span> &middot; $${p.price_usd} ${p.price_label}</div></div></div></th>`;

  const survey = p => p.survey_q3 || p.survey_q5;
  const hypeCell = p =>
    `<div class="numrow"><span class="num">${p.hype}</span><span class="of">/ 100</span>` +
    `<span class="side">Wikipedia <b>${ratioText(p.attention_ratios.wikipedia)}</b><br>YouTube <b>${ratioText(p.attention_ratios.youtube)}</b></span></div>` +
    `<div class="det">Attention vs. last year's level</div>`;
  const marketCell = p =>
    `<div class="numrow"><span class="num">${p.market.score}</span><span class="of">/ 100</span></div>` +
    `<div class="det">30-day price <b>${sgn(p.market.price_change * 100, 1)}%</b><br>Volume <b>${p.market.volume_ratio}×</b> normal</div>`;
  const walletCell = p => {
    const s = survey(p);
    return `<div class="numrow"><span class="num">${p.wallet}</span><span class="of">/ 80</span></div>` +
      `<div class="det"><b>${s.definitely}</b> definitely / <b>${s.probably}</b> probably of <b>${s.total}</b><br>` +
      `Purchase intent at $${p.price_usd} (${p.price_label})</div>`;
  };

  const floored = on.hype === 0 || nk.hype === 0;
  document.getElementById("score").innerHTML =
    `<h2>Scorecard</h2>
     <table>
       <colgroup><col class="c-label"><col><col></colgroup>
       <thead><tr><th scope="col"></th>${head("on", "On", on)}${head("nike", "Nike", nk)}</tr></thead>
       <tbody>
         <tr${floored ? ' class="has-note"' : ""}><th scope="row">Hype<small>0&ndash;100</small></th><td>${hypeCell(on)}</td><td>${hypeCell(nk)}</td></tr>
         ${floored ? `<tr class="note"><td></td><td colspan="2">Attention is below last year's level; the score floors at 0.</td></tr>` : ""}
         <tr><th scope="row">Market<small>0&ndash;100</small></th><td>${marketCell(on)}</td><td>${marketCell(nk)}</td></tr>
         <tr><th scope="row">Wallet<small>0&ndash;80</small></th><td>${walletCell(on)}</td><td>${walletCell(nk)}</td></tr>
       </tbody>
     </table>`;

  // backtest strip
  const g = d.gamestop_backtest;
  const multiple = (1 + g.market.price_change).toFixed(1) + "×";
  const pct = "+" + Math.round(g.market.price_change * 100).toLocaleString("en-US") + "%";
  const hind = g.after_window
    ? `<p><strong>${g.after_window.hindsight_label} in hindsight.</strong> Three weeks after the window the stock was down ` +
      `${Math.abs(Math.round(g.after_window.change_to_02_19 * 100))}% ($${g.after_window.close_2021_01_29.toFixed(2)} to ` +
      `$${g.after_window.close_2021_02_19.toFixed(2)}, 19 Feb 2021, split-adjusted prices). Two months after, it was still ` +
      `${Math.abs(Math.round(g.after_window.change_to_03_31 * 100))}% below the window-end close. ` +
      `This label is not from the verdict formula, which needs a Wallet score that cannot be collected for 2021.</p>`
    : "";
  document.getElementById("gme").innerHTML =
    `<div class="strip-head">${logo("gme", "GameStop")}<h2>What real hype looks like</h2></div>
     <p class="lede">GameStop, 30 days to ${g.window_end} vs. the year before. No Wallet: nobody can survey 2021 buyers today.</p>
     <div class="figs">
       <div class="fig"><div class="big">${g.wikipedia_ratio.toFixed(1)}×</div><div class="cap">Wikipedia attention</div><div class="sub">vs. prior-year median</div></div>
       <div class="fig"><div class="big">${multiple}</div><div class="cap">Stock price</div><div class="sub">${pct} in 30 days</div></div>
       <div class="fig"><div class="big">${g.hype}</div><div class="cap">Hype</div><div class="sub">out of 100</div></div>
       <div class="fig"><div class="big">${g.market.score}</div><div class="cap">Market</div><div class="sub">out of 100</div></div>
     </div>
     <div class="reading">${hind}<p>For comparison, today's Hype is On ${on.hype} and Nike ${nk.hype}; Market is On ${on.market.score} and Nike ${nk.market.score}.</p></div>`;

  document.getElementById("limits").textContent =
    "Limits: synthetic panel; stated intent overstates buying; Hype from Wikipedia and YouTube only.";
}

// Prefer the live results.json; fall back to the embedded copy when opened from file://
fetch("results.json").then(r => r.json())
  .catch(() => JSON.parse(document.getElementById("embedded").textContent))
  .then(render);
</script>
</body>
</html>
