<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hype vs. Wallet</title>
<style>
  :root {
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --card: #ffffff;
    --on: #0ea5e9; --nike: #f97316; --navy: #0b1220;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; --bad-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: linear-gradient(135deg, #0b1220 0%, #1e293b 100%); color: #fff; padding: 2.2rem 1rem 5.5rem; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 1rem; }
  .eyebrow { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: #94a3b8; }
  header h1 { margin: .35rem 0 0; font-size: 1.9rem; font-weight: 750; letter-spacing: -.02em; }
  header p { margin: .4rem 0 0; color: #cbd5e1; font-size: .95rem; }

  main { margin-top: -3.6rem; padding-bottom: 3rem; }
  .card { background: var(--card); border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08); }

  #verdict { padding: 1.6rem 1.8rem; display: flex; gap: 1.4rem; align-items: center; flex-wrap: wrap; }
  .badge { font-size: .8rem; font-weight: 800; letter-spacing: .12em; padding: .55rem .95rem; border-radius: 999px; white-space: nowrap; }
  .badge.inline { color: var(--ok); background: var(--ok-bg); }
  .badge.over { color: var(--bad); background: var(--bad-bg); }
  .badge.under { color: var(--warn); background: var(--warn-bg); }
  #verdict .text { flex: 1; min-width: 240px; }
  #verdict .headline { font-size: 1.55rem; font-weight: 750; letter-spacing: -.015em; }
  #verdict .detail { margin-top: .35rem; color: var(--muted); font-size: .92rem; line-height: 1.5; }

  .section-title { margin: 2.2rem 0 .8rem; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  .compare { display: grid; grid-template-columns: 120px 1fr 1fr; gap: .8rem; align-items: stretch; }
  .col-head { padding: .9rem 1.1rem; border-radius: 12px; color: #fff; }
  .col-head.on { background: var(--on); } .col-head.nike { background: var(--nike); }
  .col-head { display: flex; align-items: center; gap: .8rem; }
  .logo { background: #fff; border-radius: 10px; width: 64px; height: 48px; flex: none; display: flex;
          align-items: center; justify-content: center; padding: 6px; }
  .logo img { max-width: 100%; max-height: 100%; display: block; }
  .gme-head { display: flex; align-items: center; gap: .9rem; }
  .gme-head .logo { width: 110px; }
  .col-head .name { font-size: 1.15rem; font-weight: 750; }
  .col-head .meta { font-size: .8rem; opacity: .92; margin-top: .15rem; }
  .row-label { display: flex; flex-direction: column; justify-content: center; }
  .row-label .t { font-weight: 700; font-size: .95rem; }
  .row-label .s { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
  .tile { padding: 1.1rem 1.2rem; border-top: 4px solid var(--accent); }
  .tile.on { --accent: var(--on); } .tile.nike { --accent: var(--nike); }
  .tile .score { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .score span { font-size: .95rem; font-weight: 600; color: var(--muted); margin-left: .25rem; letter-spacing: 0; }
  .tile .sub { margin-top: .6rem; color: var(--muted); font-size: .85rem; line-height: 1.55; }
  .tile .sub b { color: var(--ink); font-weight: 650; }

  .gme { background: linear-gradient(135deg, #0b1220 0%, #1e293b 100%); color: #fff; padding: 1.6rem 1.8rem; }
  .gme h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.01em; }
  .gme .sub { color: #94a3b8; font-size: .88rem; margin-top: .3rem; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.3rem; }
  .stat { background: rgba(255,255,255,.07); border-radius: 10px; padding: .9rem 1rem; }
  .stat .v { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; margin-top: .2rem; }

  .bt { width: 100%; border-collapse: collapse; margin-top: 1.3rem; font-size: .88rem; }
  .bt th { text-align: left; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8;
           padding: .5rem .6rem; border-bottom: 1px solid rgba(255,255,255,.18); }
  .bt td { padding: .6rem; border-bottom: 1px solid rgba(255,255,255,.08); font-variant-numeric: tabular-nums; }
  .bt td:first-child { color: #cbd5e1; }
  .bt td:nth-child(2) { font-weight: 700; }

  .hind { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1.3rem; padding: 1rem 1.1rem;
          background: rgba(255,255,255,.07); border-radius: 10px; }
  .hind .hind-text { flex: 1; min-width: 240px; font-size: .88rem; line-height: 1.55; color: #e2e8f0; }

  .limits { margin-top: 1.6rem; padding: .9rem 1.2rem; border-left: 4px solid var(--warn); background: var(--warn-bg);
            color: #78350f; font-size: .88rem; border-radius: 0 10px 10px 0; line-height: 1.5; }
  footer { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 1.4rem; }

  @media (max-width: 720px) {
    .compare { grid-template-columns: 1fr 1fr; }
    .compare .spacer { display: none; }
    .row-label { grid-column: 1 / -1; margin-top: .6rem; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Attention vs. buyers</div>
    <h1>Hype vs. Wallet</h1>
    <p>Is the attention on this product backed by buyers willing to pay for it?</p>
  </div>
</header>

<main class="wrap">
  <section id="verdict" class="card">Loading...</section>

  <div class="section-title">Scorecard</div>
  <section id="grid" class="compare"></section>

  <div class="section-title">Backtest</div>
  <section id="gme" class="card gme"></section>

  <div class="limits" id="limits"></div>
  <footer id="footer"></footer>
</main>

<script>
function ratioText(r) { return r.toFixed(2) + "x last year"; }

function render(d) {
  const v = d.verdict, on = d.products.On, nk = d.products.Nike;
  const cfg = {
    "OVERHYPED":       { cls: "over",   text: "OVERHYPED relative to " + v.control },
    "UNDER-THE-RADAR": { cls: "under",  text: "UNDER-THE-RADAR relative to " + v.control },
    "IN LINE":         { cls: "inline", text: "IN LINE with " + v.control }
  }[v.verdict];
  const sign = v.difference > 0 ? "+" : "";
  document.getElementById("verdict").innerHTML =
    '<span class="badge ' + cfg.cls + '">' + v.verdict + '</span>' +
    '<div class="text"><div class="headline">' + v.product + ': ' + cfg.text + '</div>' +
    '<div class="detail">Hype minus Wallet gap: ' + v.product + ' ' + v.product_gap + ', ' + v.control + ' ' + v.control_gap +
    '. Difference ' + sign + v.difference + ' (a verdict needs more than 15 either way).</div></div>';

  const logo = (key, alt) => '<span class="logo"><img src="' + LOGOS[key] + '" alt="' + alt + ' logo"></span>';
  const head = (cls, name, p) =>
    '<div class="col-head ' + cls + '">' + logo(cls, name) + '<div><div class="name">' + name + '</div>' +
    '<div class="meta">' + p.ticker + ' &middot; $' + p.price_usd + ' ' + p.price_label + '</div></div></div>';

  const rows = [
    { t: "Hype", s: "0-100", f: p => '<div class="score">' + p.hype + '<span>/ 100</span></div>' +
        '<div class="sub">Wikipedia <b>' + ratioText(p.attention_ratios.wikipedia) + '</b><br>YouTube <b>' +
        ratioText(p.attention_ratios.youtube) + '</b></div>' },
    { t: "Market", s: "0-100", f: p => '<div class="score">' + p.market.score + '<span>/ 100</span></div>' +
        '<div class="sub">30-day price <b>' + (p.market.price_change * 100).toFixed(1) + '%</b><br>Volume <b>' +
        p.market.volume_ratio + 'x</b> normal</div>' },
    { t: "Wallet", s: "0-80", f: p => '<div class="score">' + p.wallet + '<span>/ 80</span></div>' +
        '<div class="sub">Purchase intent at <b>$' + p.price_usd + '</b><br>Panel of <b>' + d.sample_size + '</b></div>' }
  ];

  let html = '<div class="spacer"></div>' + head("on", "On", on) + head("nike", "Nike", nk);
  rows.forEach(r => {
    html += '<div class="row-label"><div class="t">' + r.t + '</div><div class="s">' + r.s + '</div></div>' +
      '<div class="card tile on">' + r.f(on) + '</div><div class="card tile nike">' + r.f(nk) + '</div>';
  });
  document.getElementById("grid").innerHTML = html;

  const g = d.gamestop_backtest;
  document.getElementById("gme").innerHTML =
    '<div class="gme-head">' + logo("gme", "GameStop") + '<h2>What real hype looks like</h2></div>' +
    '<div class="sub">GameStop, last 30 days up to ' + g.window_end + ' vs. the year before. No Wallet: nobody can survey 2021 buyers today.</div>' +
    '<div class="stats">' +
    '<div class="stat"><div class="v">' + Math.round(g.wikipedia_ratio) + 'x</div><div class="l">Wikipedia attention</div></div>' +
    '<div class="stat"><div class="v">~' + Math.round(g.market.price_change) + 'x</div><div class="l">Stock up</div></div>' +
    '<div class="stat"><div class="v">' + g.hype + '</div><div class="l">Hype</div></div>' +
    '<div class="stat"><div class="v">' + g.market.score + '</div><div class="l">Market</div></div></div>' +
    '<table class="bt"><thead><tr><th>Backtest result</th><th>GameStop (GME)</th><th>On vs. Nike today</th></tr></thead><tbody>' +
    '<tr><td>Wikipedia attention</td><td>' + g.wikipedia_ratio.toFixed(1) + 'x the prior-year median</td><td>' +
      on.attention_ratios.wikipedia.toFixed(2) + 'x / ' + nk.attention_ratios.wikipedia.toFixed(2) + 'x</td></tr>' +
    '<tr><td>Hype score</td><td>' + g.hype + ' / 100</td><td>' + on.hype + ' / ' + nk.hype + '</td></tr>' +
    '<tr><td>30-day stock move</td><td>+' + Math.round(g.market.price_change * 100).toLocaleString() + '%</td><td>' +
      (on.market.price_change * 100).toFixed(1) + '% / ' + (nk.market.price_change * 100).toFixed(1) + '%</td></tr>' +
    '<tr><td>Trading volume</td><td>' + g.market.volume_ratio.toFixed(1) + 'x normal</td><td>' +
      on.market.volume_ratio + 'x / ' + nk.market.volume_ratio + 'x</td></tr>' +
    '<tr><td>Market score</td><td>' + g.market.score + ' / 100</td><td>' + on.market.score + ' / ' + nk.market.score + '</td></tr>' +
    '</tbody></table>' +
    (g.after_window ?
      '<div class="hind"><span class="badge over">' + g.after_window.hindsight_label + ' (IN HINDSIGHT)</span>' +
      '<div class="hind-text">Three weeks after the window the stock was down ' +
      Math.abs(Math.round(g.after_window.change_to_02_19 * 100)) + '% ($' + g.after_window.close_2021_01_29.toFixed(2) + ' to $' +
      g.after_window.close_2021_02_19.toFixed(2) + ', 19 Feb 2021, split-adjusted prices). Two months after, it was still ' +
      Math.abs(Math.round(g.after_window.change_to_03_31 * 100)) + '% below the window-end close. ' +
      'This label is not from the verdict formula, which needs a Wallet score that cannot be collected for 2021.</div></div>' : '') +
    '<div class="sub" style="margin-top:.9rem">Reading it: at GameStop both signals hit the ceiling together, attention and investors. ' +
    'On and Nike sit near the floor on attention and near the middle on the stock, so neither looks like a hype spike.</div>';

  document.getElementById("limits").textContent =
    "Limits: synthetic panel; stated intent overstates buying; Hype from Wikipedia and YouTube only.";
  document.getElementById("footer").textContent = "Data as of " + d.generated + ".";
}
